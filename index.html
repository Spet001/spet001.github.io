        const useIntersectionObserver = (options = {}) => {
            const [isIntersecting, setIsIntersecting] = useState(false);
            const ref = useRef(null);

            useEffect(() => {
                const element = ref.current;
                if (!element) return;
                const observer = new IntersectionObserver(([entry]) => {
                    if (entry.isIntersecting) {
                        setIsIntersecting(true);
                        observer.unobserve(element);
                    }
                }, { threshold: 0.1, ...options });

                observer.observe(element);
                return () => observer.unobserve(element);
            }, [options]);

            return [ref, isIntersecting];
        };

        const FadeInSection = ({ children, className = '', delay = '' }) => {
            const [ref, isVisible] = useIntersectionObserver();
            return (

            const canvasRef = useRef(null);
            const moonPosRef = useRef({ x: window.innerWidth * 0.7, y: window.innerHeight * 0.3 });

            useEffect(() => {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                let animationFrameId;
                let stars = [];

                const initStars = () => {
                    stars = Array.from({ length: 400 }).map(() => ({
                        x: Math.random() * window.innerWidth,
                        y: Math.random() * window.innerHeight,
                        z: Math.random() * window.innerWidth,
                        size: Math.random() * 1.5 + 0.5
                    }));
                };

                const handleResize = () => {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                    initStars();
                };

                handleResize();

                const handleKeyDown = (e) => keysRef.current[e.key] = true;
                const handleKeyUp = (e) => keysRef.current[e.key] = false;
                window.addEventListener('keydown', handleKeyDown);
                window.addEventListener('keyup', handleKeyUp);
                window.addEventListener('resize', handleResize);

                const render = () => {
                    const speed = 4;
                    if (keysRef.current['ArrowUp']) moonPosRef.current.y -= speed;
                    if (keysRef.current['ArrowDown']) moonPosRef.current.y += speed;
                    if (keysRef.current['ArrowLeft']) moonPosRef.current.x -= speed;
                    if (keysRef.current['ArrowRight']) moonPosRef.current.x += speed;

                    ctx.fillStyle = '#050505';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    // Draw Moon
                    const gradient = ctx.createRadialGradient(
                        moonPosRef.current.x, moonPosRef.current.y, 10,
                        moonPosRef.current.x, moonPosRef.current.y, 60
                    );
                    gradient.addColorStop(0, 'rgba(0, 170, 255, 0.15)');
                    gradient.addColorStop(1, 'rgba(0, 170, 255, 0)');

                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(moonPosRef.current.x, moonPosRef.current.y, 80, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#e2e8f0';
                    ctx.beginPath();
                    ctx.arc(moonPosRef.current.x, moonPosRef.current.y, 30, 0, Math.PI * 2);
                    ctx.fill();

                    // Craters
                    ctx.fillStyle = 'rgba(15, 23, 42, 0.2)';
                    ctx.beginPath(); ctx.arc(moonPosRef.current.x - 10, moonPosRef.current.y - 10, 6, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(moonPosRef.current.x + 12, moonPosRef.current.y + 5, 8, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(moonPosRef.current.x - 5, moonPosRef.current.y + 15, 4, 0, Math.PI * 2); ctx.fill();

                    // Move & Draw Stars
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                    stars.forEach(star => {
                        star.z -= 0.5; // speed
                        if (star.z <= 0) {
                            star.z = canvas.width;
                            star.x = Math.random() * canvas.width;
                            star.y = Math.random() * canvas.height;
                        }
                        const perspective = canvas.width / star.z;
                        const px = (star.x - canvas.width / 2) * perspective + canvas.width / 2;
                        const py = (star.y - canvas.height / 2) * perspective + canvas.height / 2;
                        const pSize = star.size * perspective * 0.5;

                        ctx.beginPath();
                        ctx.arc(px, py, pSize > 0 ? pSize : 0.1, 0, Math.PI * 2);
                        ctx.fill();
                    });

                    animationFrameId = requestAnimationFrame(render);
                };

                render();

                return () => {
                    window.removeEventListener('keydown', handleKeyDown);
                    window.removeEventListener('keyup', handleKeyUp);
                    window.removeEventListener('resize', handleResize);
                    cancelAnimationFrame(animationFrameId);
                };
            }, []);

            return <canvas ref={canvasRef} className="fixed inset-0 -z-10 opacity-70" />;

                            </a>
                        </div>
                        <button onClick={() => setActive(null)} className="px-4 py-2 bg-red-600 hover:bg-red-700 text-white font-bold rounded flex items-center gap-2 transition">
                            <i className="fas fa-times"></i> {t('easter.exit')}
                        </button>
                    </div>
                    <iframe src={url} className="w-full flex-grow border-none" title="Easter Egg Game"></iframe>
                </div>
            );
        };

        const Footer = ({ setEasterEgg }) => {
            const { t } = useContext(LanguageContext);
            const [showMenu, setShowMenu] = useState(false);

            return (
                <footer className="py-12 border-t border-slate-800/50 relative mt-12 bg-slate-950/50">
                    <div className="max-w-6xl mx-auto px-6 flex flex-col md:flex-row items-center justify-between gap-6 text-slate-500 text-sm">
                        {/* Easter egg hidden menu */}
                        <div className="relative">
                            <button
                                onClick={() => setShowMenu(!showMenu)}
                                className="opacity-50 hover:opacity-100 transition-opacity text-xs"
                            >
                                {t('easter.hint')}
                            </button>

                            {showMenu && (
                                <div className="absolute bottom-full right-0 mb-2 w-48 bg-slate-800 border border-slate-700 rounded-lg shadow-xl overflow-hidden z-50">
                                    <button onClick={() => setEasterEgg('doom')} className="w-full text-left px-4 py-3 hover:bg-primary/20 hover:text-primary text-white transition">
                                        <i className="fas fa-ghost mr-2"></i>{t('easter.doom')}
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>
                </footer>
            );
        };

        const App = () => {
            const [lang, setLang] = useState('pt');
            const [easterEgg, setEasterEgg] = useState(null);

            const t = (path, options = {}) => {
                const keys = path.split('.');
                let result = translations[lang];
                for (const key of keys) {
                    if (result[key] === undefined) return path;
                    result = result[key];
                }
                return result;
            };

            return (
                <LanguageContext.Provider value={{ lang, setLang, t }}>
                    <Starfield />
                    <Navbar setEasterEgg={setEasterEgg} />
                    <main>
                        <Hero />
                        <About />
                        <Projects />
                    </main>
                    <Footer setEasterEgg={setEasterEgg} />
                    <EasterEgg active={easterEgg} setActive={setEasterEgg} />
                </LanguageContext.Provider>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
